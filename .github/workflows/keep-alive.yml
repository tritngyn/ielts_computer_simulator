name: Supabase Keep Alive Bot

on:
  schedule:
    # Chạy vào lúc 00:00 UTC (tương đương 07:00 sáng giờ Việt Nam) mỗi ngày
    - cron: "0 0 * * *"
  # Dòng này cho phép bạn bấm nút chạy thử thủ công (Run workflow) trên GitHub Actions
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Đánh thức Supabase bằng Service Role
        run: |
          curl -s -f -X GET '${{ secrets.SUPABASE_URL }}/rest/v1/User?select=*&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
